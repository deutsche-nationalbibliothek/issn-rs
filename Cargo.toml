[package]
name = "issn"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
authors = ["Nico Wagner <n.wagner@dnb.de>"]
description = "A library to work with International Standard Serial Number (ISSN)"
repository = "https://github.com/deutsche-nationalbibliothek/issn-rs"
license = "EUPL-1.2"
readme = "README.md"
categories = ["parser-implementations"]
keywords = ["code4lib"]


[features]
default = ["performant"]
perf-inline = []
performant = ["perf-inline"]

[dependencies]
arrayvec = "0.7.8"

[[test]]
name = "integration"
path = "tests/lib.rs"

[[example]]
path = "examples/validate.rs"
name = "validate"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
